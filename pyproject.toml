[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "IceColdRhino", email = "IceColdRhino@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.5",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.11.1",
    "toml>=0.10.2",
    "websockets>=17.0.1",
]

[project.scripts]
app = "app:__main__"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
]
